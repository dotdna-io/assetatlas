# PostgreSQL Configuration for AssetAtlas
# This file contains optimizations for TimescaleDB and AssetAtlas workload
# Uncomment the docker-compose.yml volume mount to use this

# ============================================================================
# CONNECTIONS AND AUTHENTICATION
# ============================================================================

max_connections = 100
# Adjust based on your application needs

# ============================================================================
# MEMORY SETTINGS
# ============================================================================

# Shared buffers (25% of total RAM is recommended)
# For 4GB RAM server: 1GB
# For 8GB RAM server: 2GB
shared_buffers = 1GB

# Effective cache size (50-75% of total RAM)
effective_cache_size = 3GB

# Work memory (RAM / max_connections / 2)
work_mem = 20MB

# Maintenance work memory (for VACUUM, CREATE INDEX)
maintenance_work_mem = 256MB

# ============================================================================
# QUERY TUNING
# ============================================================================

# Random page cost (lower for SSD)
random_page_cost = 1.1

# Effective I/O concurrency (for SSD)
effective_io_concurrency = 200

# ============================================================================
# WRITE-AHEAD LOG (WAL)
# ============================================================================

# WAL level (for replication/backup)
wal_level = replica

# Maximum WAL size
max_wal_size = 2GB
min_wal_size = 1GB

# Checkpoint settings
checkpoint_completion_target = 0.9

# ============================================================================
# LOGGING
# ============================================================================

# Log slow queries (helps identify performance issues)
log_min_duration_statement = 1000  # Log queries > 1 second

# Log connections/disconnections
log_connections = on
log_disconnections = on

# Log statement type
log_statement = 'ddl'  # Log DDL statements

# ============================================================================
# TIMESCALEDB SPECIFIC
# ============================================================================

# TimescaleDB extension
shared_preload_libraries = 'timescaledb'

# TimescaleDB tuning
timescaledb.max_background_workers = 8

# ============================================================================
# AUTOVACUUM
# ============================================================================

# Enable autovacuum (important for PostgreSQL health)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 10s

# ============================================================================
# CLIENT CONNECTION DEFAULTS
# ============================================================================

# Timezone
timezone = 'UTC'

# Encoding
client_encoding = 'UTF8'

# Locale
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
