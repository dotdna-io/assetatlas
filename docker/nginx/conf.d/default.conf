# AssetAtlas API Server Configuration

upstream assetatlas_api {
    server api:5001;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Client body size limit (for file uploads)
    client_max_body_size 50M;

    # Request timeouts (300s to support large sample fetches)
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # Rate limiting
    limit_req zone=api_limit burst=50 nodelay;
    limit_conn conn_limit 20;

    # Prometheus stub_status for nginx-prometheus-exporter (epic #487)
    # Allowed from loopback and the Docker default bridge range only.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1/32;
        allow 172.16.0.0/12;
        deny all;
    }

    # Health check endpoint (bypass rate limiting)
    location /api/health {
        limit_req off;
        proxy_pass http://assetatlas_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints
    location /api/ {
        proxy_pass http://assetatlas_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Timeouts for long-running API calls (300s to match prod config)
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Block access to sensitive paths
    location ~ /\. {
        deny all;
        return 404;
    }

    # Default response for non-API paths
    location / {
        return 404 '{"error": "Not Found", "message": "API endpoints are available at /api/"}';
        add_header Content-Type application/json;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

