# AssetAtlas Production Configuration
# Proxies: /api/* -> Flask API, /mcp/* -> MCP server, /* -> Node.js UI
#
# Uses variables for proxy_pass so nginx re-resolves via container DNS.
# Static upstream blocks cache IPs forever, causing 502s after container recreate.
# That is what makes the `resolver` directive below load-bearing — read the
# comment there before touching it.

# HTTP -> HTTPS redirect
#
# HTTPS_PORT is substituted by the nginx image's envsubst entrypoint at
# container start (see the nginx service in docker-compose.yml). This was
# hardcoded to 8443, which is merely the installer's *default* — it prompts for
# the port, and any other answer produced a redirect to a dead port. online.conf
# had the same bug with a different wrong answer; both now read from .env.
#
# Named above without the ${...} braces on purpose: envsubst rewrites every
# occurrence it finds, so spelling the placeholder out in prose would leave the
# rendered conf on the box reading "8443 is substituted by the nginx image's
# envsubst entrypoint" — the explanation eaten by the thing it explains.
server {
    listen 80;
    server_name _;

    # nginx-prometheus-exporter scrapes stub_status over plain HTTP on the
    # container network, so it must be answered here rather than redirected: the
    # redirect below names HTTPS_PORT, which is the port published on the HOST.
    # Inside the container nginx only listens on 443, so following that redirect
    # got the exporter `connection refused`, nginx_up went to 0, and a healthy
    # install raised a critical "nginx is down" alert.
    #
    # Same allow/deny as the HTTPS block. A request arriving through the
    # published host port keeps its real source address and is refused with 403,
    # so exposing it here adds no reachability the HTTPS block did not already.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1/32;
        allow 172.16.0.0/12;
        deny all;
    }

    # The redirect has to sit inside `location /`, not at server level: a
    # server-level `return` executes in the server-rewrite phase, which runs
    # BEFORE location selection, so it would swallow /nginx_status above.
    location / {
        return 301 https://$host:${HTTPS_PORT}$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Container DNS — re-resolve hostnames every 30s.
    #
    # NEVER put a literal address here. This value is RUNTIME-DEPENDENT: Docker's
    # embedded DNS answers on 127.0.0.11, Podman's aardvark-dns does not. It was
    # hardcoded to Docker's address, and under Podman that made EVERY proxied
    # request 502 while the stack still reported healthy — nginx's healthcheck is
    # `nginx -t`, which only checks syntax. `getent hosts api` keeps working
    # throughout, because that reads /etc/resolv.conf and this directive is the
    # only thing nginx consults for the $upstream_* names below. See online.conf
    # for the full account.
    #
    # NGINX_LOCAL_RESOLVERS (named without braces on purpose, per the note above
    # the redirect) is exported at container start by the image's entrypoint and
    # substituted by its envsubst pass. Both halves are wired up in the nginx
    # service in docker-compose.yml; miss either and nginx exits at startup on
    # the unsubstituted literal.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    set $upstream_api  http://api:5001;
    set $upstream_ui   http://ui:3000;
    set $upstream_mcp  http://mcp:8100;
    set $upstream_teams http://teams-bridge:3978;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client body size limit (file uploads)
    client_max_body_size 50M;

    # Prometheus stub_status for nginx-prometheus-exporter (epic #487)
    # Allowed from loopback and the Docker default bridge range only.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1/32;
        allow 172.16.0.0/12;
        deny all;
    }

    # API health check (no rate limiting)
    location /api/health {
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flasgger static assets
    location /flasgger_static {
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /apispec_1.json {
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API endpoints
    location /api/ {
        # Rate limiting (API only, not static assets)
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 20;

        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Timeouts (300s to support large data fetches like Lansweeper 33k+ records)
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # MCP server (AI assistant integration)
    #
    # Same split as online.conf, for the same reason: FastMCP mounts Streamable
    # HTTP at `/mcp` with NO trailing slash, and a *prefix* `location /mcp/`
    # served by proxy_pass makes nginx answer that request with its auto-slash
    # 301 — built from its own `listen 443`, so the published HTTPS_PORT is
    # dropped and the client is redirected to a closed port. The exact match
    # wins over the prefix location, so no redirect is generated. Host is
    # $http_host rather than $host so the port survives for the app's own 307
    # bounce off /mcp/. See online.conf for the full account.
    location = /mcp {
        proxy_pass $upstream_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE support (MCP Streamable HTTP uses Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /mcp/ {
        proxy_pass $upstream_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE support (MCP Streamable HTTP uses Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Microsoft Teams bot — three /teams/* code paths split by destination:
    #   /teams/api/messages   -> teams-bridge container (Bot Framework webhook)
    #   /teams/link?token=…   -> Flask API blueprint teams_bot_bp (link page)
    #   /teams/linked         -> Flask API blueprint teams_bot_bp (success page)
    # The earlier broad `location /teams/ -> bridge` rule swallowed the link
    # pages and returned aiohttp's signature 14-byte 404. Routing the bridge
    # via an exact match (`location =`) and falling through to the API on
    # everything else under /teams/ keeps both paths working.
    location = /teams/api/messages {
        rewrite ^/teams/(.*)$ /$1 break;
        proxy_pass $upstream_teams;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # A chat turn that hits the LLM tool loop can hold the request
        # open for tens of seconds before the bridge sends its response.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /teams/ {
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Block access to dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }

    # Everything else -> UI
    location / {
        proxy_pass $upstream_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
