# AssetAtlas Production Configuration — Internet-Connected Deployment
# Standard ports: HTTP 80, HTTPS 443
# Proxies: /api/* -> Flask API, /mcp/* -> MCP server, /* -> Node.js UI
#
# NOTE: We use variables ($upstream_*) instead of upstream blocks so that nginx
# re-resolves container hostnames through the container runtime's DNS on every
# request. With static upstream blocks, nginx resolves IPs once at startup and
# caches them forever — causing 502s when containers are recreated during
# updates. That choice is what makes the `resolver` directive below load-bearing;
# see the comment there before touching it.

# HTTP -> HTTPS redirect
#
# HTTPS_PORT is substituted by the nginx image's envsubst entrypoint at
# container start (see the nginx service in docker-compose.yml). It is NOT
# optional: $host is the Host header with the port STRIPPED, so a bare
# `https://$host` redirects to 443 — and compose publishes HTTPS on 8443 by
# default, which the installer additionally prompts to change. That sent every
# operator who typed http://host:8080 to a port with nothing listening on it.
#
# Named above without the ${...} braces on purpose: envsubst rewrites every
# occurrence it finds, so spelling the placeholder out in prose would leave the
# rendered conf on the box reading "8443 is substituted by the nginx image's
# envsubst entrypoint" — the explanation eaten by the thing it explains.
server {
    listen 80;
    server_name _;

    # nginx-prometheus-exporter scrapes stub_status over plain HTTP on the
    # container network, so it must be answered here rather than redirected: the
    # redirect below names HTTPS_PORT, which is the port published on the HOST.
    # Inside the container nginx only listens on 443, so following that redirect
    # got the exporter `connection refused`, nginx_up went to 0, and a healthy
    # install raised a critical "nginx is down" alert.
    #
    # Same allow/deny as the HTTPS block. A request arriving through the
    # published host port keeps its real source address and is refused with 403,
    # so exposing it here adds no reachability the HTTPS block did not already.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1/32;
        allow 172.16.0.0/12;
        deny all;
    }

    # The redirect has to sit inside `location /`, not at server level: a
    # server-level `return` executes in the server-rewrite phase, which runs
    # BEFORE location selection, so it would swallow /nginx_status above.
    location / {
        return 301 https://$host:${HTTPS_PORT}$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # The container runtime's own DNS — re-resolve container hostnames every 30s.
    #
    # NEVER put a literal address here. This value is RUNTIME-DEPENDENT: Docker's
    # embedded DNS answers on 127.0.0.11, Podman's aardvark-dns does not (10.89.0.1
    # on the host where this was caught). It was hardcoded to Docker's address, and
    # under Podman that made EVERY proxied request 502 — while the whole stack
    # reported healthy, because nginx's healthcheck is `nginx -t`, which validates
    # syntax and nothing else. It hides especially well because `getent hosts api`
    # inside this container keeps working: that path reads /etc/resolv.conf, which
    # nginx does NOT consult for the $upstream_* names below. This directive is the
    # only thing that resolves them.
    #
    # The placeholder is filled at container start by the nginx image's entrypoint
    # (15-local-resolvers.envsh derives NGINX_LOCAL_RESOLVERS — named here without
    # the braces, per the note above the redirect — from /etc/resolv.conf, and
    # 20-envsubst-on-templates.sh substitutes it). Both halves are wired up in the
    # nginx service in docker-compose.yml and neither is optional: the export is an
    # opt-in, and the envsubst filter has to name the variable. Miss either and
    # nginx exits at startup on the unsubstituted literal.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=30s ipv6=off;
    set $upstream_api  http://api:5001;
    set $upstream_ui   http://ui:3000;
    set $upstream_mcp  http://mcp:8100;
    set $upstream_teams http://teams-bridge:3978;

    # SSL configuration
    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Client body size limit (file uploads)
    client_max_body_size 50M;

    # Prometheus stub_status for nginx-prometheus-exporter (epic #487)
    # Allowed from loopback and the Docker default bridge range only.
    location = /nginx_status {
        stub_status;
        allow 127.0.0.1/32;
        allow 172.16.0.0/12;
        deny all;
    }

    # API health check (no rate limiting)
    location /api/health {
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flasgger static assets
    location /flasgger_static {
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /apispec_1.json {
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # API endpoints
    location /api/ {
        # Rate limiting (API only, not static assets)
        limit_req zone=api_limit burst=50 nodelay;
        limit_conn conn_limit 20;

        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 32k;
        proxy_busy_buffers_size 64k;

        # Timeouts (300s to support large data fetches like Lansweeper 33k+ records)
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # MCP server (AI assistant integration)
    #
    # The exact-match block is the one clients actually use, and it is not a
    # duplicate of the prefix block below: FastMCP mounts Streamable HTTP at
    # `/mcp` with NO trailing slash, so a client POSTs there — and a *prefix*
    # `location /mcp/` served by proxy_pass makes nginx answer that with its
    # documented auto-slash 301 to /mcp/. With absolute_redirect at its default
    # `on` nginx builds that target from its own `listen 443` and then omits
    # the port as the scheme default, while the bundle publishes HTTPS on
    # HTTPS_PORT — so the client was sent to a closed port and no handshake
    # could complete. An exact match wins over the prefix location, so nginx
    # generates no redirect at all.
    #
    # Host is $http_host, not $host: $host strips the port, and a request that
    # does reach the prefix block gets the app's own 307 redirect_slashes
    # bounce back to /mcp, rebuilt from the Host header and X-Forwarded-Proto
    # (the app honours it from any peer, #1448), so the redirect keeps the
    # client's scheme, host and port. /mcp stays the documented entry point:
    # it costs no extra round trip, and a client that will not re-POST a
    # body across a 307 never sees one.
    location = /mcp {
        proxy_pass $upstream_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE support (MCP Streamable HTTP uses Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /mcp/ {
        proxy_pass $upstream_mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE support (MCP Streamable HTTP uses Server-Sent Events)
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Microsoft Teams bot — three /teams/* code paths split by destination:
    #   /teams/api/messages   -> teams-bridge container (Bot Framework webhook)
    #   /teams/link?token=…   -> Flask API blueprint teams_bot_bp (link page)
    #   /teams/linked         -> Flask API blueprint teams_bot_bp (success page)
    # The earlier broad `location /teams/ -> bridge` rule swallowed the link
    # pages and returned aiohttp's signature 14-byte 404. Routing the bridge
    # via an exact match (`location =`) and falling through to the API on
    # everything else under /teams/ keeps both paths working.
    location = /teams/api/messages {
        rewrite ^/teams/(.*)$ /$1 break;
        proxy_pass $upstream_teams;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # A chat turn that hits the LLM tool loop can hold the request
        # open for tens of seconds before the bridge sends its response.
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /teams/ {
        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Block access to dotfiles
    location ~ /\. {
        deny all;
        return 404;
    }

    # Everything else -> UI
    location / {
        proxy_pass $upstream_ui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
