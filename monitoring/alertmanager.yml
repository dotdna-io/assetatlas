global:
  resolve_timeout: 5m

route:
  receiver: assetatlas_webhook
  group_by: ['alertname']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: assetatlas_webhook
    webhook_configs:
      - url: http://api:5001/api/alerts/webhook/alertmanager
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/webhook-secret
