  <!-- Concentric circles -->
  <circle cx="60" cy="60" r="15" fill="url(#circle-grad-3)" opacity="0.9"/>
  <circle cx="60" cy="60" r="30" fill="none" stroke="url(#circle-grad-2)" stroke-width="10" opacity="0.8"/>
  <circle cx="60" cy="60" r="45" fill="none" stroke="url(#circle-grad-1)" stroke-width="10" opacity="0.7"/>
