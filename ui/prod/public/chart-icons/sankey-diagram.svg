<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sankey-flow-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:0.9" />
    </linearGradient>
    <linearGradient id="sankey-flow-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#F59E0B;stop-opacity:0.8" />
    </linearGradient>
    <linearGradient id="sankey-flow-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#EF4444;stop-opacity:0.9" />
    </linearGradient>
  </defs>

  <!-- Left nodes -->
  <rect x="10" y="20" width="10" height="35" rx="2" fill="#3B82F6" opacity="0.95"/>
  <rect x="10" y="65" width="10" height="30" rx="2" fill="#2563EB" opacity="0.95"/>

  <!-- Right nodes -->
  <rect x="100" y="15" width="10" height="30" rx="2" fill="#10B981" opacity="0.95"/>
  <rect x="100" y="52" width="10" height="25" rx="2" fill="#F59E0B" opacity="0.95"/>
  <rect x="100" y="85" width="10" height="20" rx="2" fill="#EF4444" opacity="0.95"/>

  <!-- Flow paths (curved connections) - increased opacity and stroke width -->
  <!-- Flow 1: top left to top right -->
  <path d="M 20 30 C 60 30, 60 25, 100 25"
        fill="none"
        stroke="url(#sankey-flow-1)"
        stroke-width="20"
        opacity="0.9"/>

  <!-- Flow 2: top left to middle right -->
  <path d="M 20 45 C 60 45, 60 60, 100 62"
        fill="none"
        stroke="url(#sankey-flow-2)"
        stroke-width="14"
        opacity="0.8"/>

  <!-- Flow 3: bottom left to bottom right -->
  <path d="M 20 78 C 60 78, 60 92, 100 92"
        fill="none"
        stroke="url(#sankey-flow-3)"
        stroke-width="16"
        opacity="0.9"/>
</svg>
