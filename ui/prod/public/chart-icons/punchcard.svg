<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="punch-grad-1">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:0.9" />
    </radialGradient>
    <radialGradient id="punch-grad-2">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:0.9" />
    </radialGradient>
    <radialGradient id="punch-grad-3">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:0.9" />
    </radialGradient>
  </defs>

  <!-- Grid lines (more visible) -->
  <line x1="25" y1="10" x2="25" y2="95" stroke="#9CA3AF" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="10" x2="50" y2="95" stroke="#9CA3AF" stroke-width="1" opacity="0.5"/>
  <line x1="75" y1="10" x2="75" y2="95" stroke="#9CA3AF" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="10" x2="100" y2="95" stroke="#9CA3AF" stroke-width="1" opacity="0.5"/>

  <line x1="15" y1="25" x2="105" y2="25" stroke="#9CA3AF" stroke-width="1" opacity="0.5"/>
  <line x1="15" y1="45" x2="105" y2="45" stroke="#9CA3AF" stroke-width="1" opacity="0.5"/>
  <line x1="15" y1="65" x2="105" y2="65" stroke="#9CA3AF" stroke-width="1" opacity="0.5"/>
  <line x1="15" y1="85" x2="105" y2="85" stroke="#9CA3AF" stroke-width="1" opacity="0.5"/>

  <!-- Grid of circles with varying sizes (punchcard/matrix style) -->
  <!-- Row 1 -->
  <circle cx="25" cy="25" r="8" fill="url(#punch-grad-1)" opacity="0.95"/>
  <circle cx="50" cy="25" r="5" fill="url(#punch-grad-2)" opacity="0.85"/>
  <circle cx="75" cy="25" r="10" fill="url(#punch-grad-3)" opacity="0.95"/>
  <circle cx="100" cy="25" r="6" fill="url(#punch-grad-1)" opacity="0.9"/>

  <!-- Row 2 -->
  <circle cx="25" cy="45" r="4" fill="url(#punch-grad-2)" opacity="0.75"/>
  <circle cx="50" cy="45" r="9" fill="url(#punch-grad-1)" opacity="0.95"/>
  <circle cx="75" cy="45" r="7" fill="url(#punch-grad-2)" opacity="0.9"/>
  <circle cx="100" cy="45" r="11" fill="url(#punch-grad-3)" opacity="0.95"/>

  <!-- Row 3 -->
  <circle cx="25" cy="65" r="10" fill="url(#punch-grad-3)" opacity="0.95"/>
  <circle cx="50" cy="65" r="6" fill="url(#punch-grad-2)" opacity="0.85"/>
  <circle cx="75" cy="65" r="5" fill="url(#punch-grad-1)" opacity="0.85"/>
  <circle cx="100" cy="65" r="8" fill="url(#punch-grad-2)" opacity="0.9"/>

  <!-- Row 4 -->
  <circle cx="25" cy="85" r="7" fill="url(#punch-grad-1)" opacity="0.9"/>
  <circle cx="50" cy="85" r="10" fill="url(#punch-grad-3)" opacity="0.95"/>
  <circle cx="75" cy="85" r="9" fill="url(#punch-grad-2)" opacity="0.95"/>
  <circle cx="100" cy="85" r="4" fill="url(#punch-grad-1)" opacity="0.75"/>
</svg>
