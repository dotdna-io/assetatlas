<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gauge-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background arc (gray/dark) -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="#374151" stroke-width="5"
          stroke-dasharray="264 264" transform="rotate(-90 60 60)" opacity="0.3"/>

  <!-- Filled arc (green gradient - about 75% complete) -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#gauge-grad)" stroke-width="5"
          stroke-dasharray="198 264" transform="rotate(-90 60 60)" opacity="0.9" stroke-linecap="round"/>

  <!-- Center text -->
  <text x="60" y="65" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#E5E7EB" text-anchor="middle">75%</text>
  <text x="60" y="80" font-family="Arial, sans-serif" font-size="11" fill="#9CA3AF" text-anchor="middle">Completion</text>
</svg>
