<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="stack-grad-1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stack-grad-2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stack-grad-3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#F59E0B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#D97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Column 1 - stacked segments -->
  <rect x="18" y="60" width="16" height="30" rx="1" fill="url(#stack-grad-1)" opacity="0.9"/>
  <rect x="18" y="45" width="16" height="15" rx="1" fill="url(#stack-grad-2)" opacity="0.9"/>
  <rect x="18" y="30" width="16" height="15" rx="1" fill="url(#stack-grad-3)" opacity="0.9"/>

  <!-- Column 2 -->
  <rect x="42" y="50" width="16" height="40" rx="1" fill="url(#stack-grad-1)" opacity="0.9"/>
  <rect x="42" y="35" width="16" height="15" rx="1" fill="url(#stack-grad-2)" opacity="0.9"/>
  <rect x="42" y="25" width="16" height="10" rx="1" fill="url(#stack-grad-3)" opacity="0.9"/>

  <!-- Column 3 -->
  <rect x="66" y="55" width="16" height="35" rx="1" fill="url(#stack-grad-1)" opacity="0.9"/>
  <rect x="66" y="35" width="16" height="20" rx="1" fill="url(#stack-grad-2)" opacity="0.9"/>
  <rect x="66" y="20" width="16" height="15" rx="1" fill="url(#stack-grad-3)" opacity="0.9"/>

  <!-- Column 4 -->
  <rect x="90" y="65" width="16" height="25" rx="1" fill="url(#stack-grad-1)" opacity="0.9"/>
  <rect x="90" y="50" width="16" height="15" rx="1" fill="url(#stack-grad-2)" opacity="0.9"/>
  <rect x="90" y="35" width="16" height="15" rx="1" fill="url(#stack-grad-3)" opacity="0.9"/>

  <!-- Baseline -->
  <line x1="12" y1="90" x2="112" y2="90" stroke="#9CA3AF" stroke-width="2"/>
</svg>
